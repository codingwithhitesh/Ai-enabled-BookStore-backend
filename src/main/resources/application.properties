spring.application.name=bookstore

# --- H2 Console Settings ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Database Connection ---
spring.datasource.url=jdbc:h2:mem:bookstore
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate Settings ---
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# --- SQL Initialization ---
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.datasource.type=com.zaxxer.hikari.HikariDataSource

# --- Groq AI Chat Model Configuration ---
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile

# --- Enable Embeddings so custom @Bean is scanned ---
spring.ai.openai.embedding.enabled=true

# --- Disable ONNX Heavy Local Models ---
spring.ai.embedding.transformer.enabled=false
spring.ai.ollama.embedding.enabled=false

# --- Retry & Rate Limit Protection ---
spring.ai.retry.max-attempts=1

# --- Vector Store Persistence ---
spring.ai.vectorstore.simple.path=vectorstore.json

# --- Render Port Binding ---
server.port=${PORT:8080}