spring.application.name=bookstore

# --- H2 Console Settings ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Database Connection ---
spring.datasource.url=jdbc:h2:mem:bookstore
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate Settings ---
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
# Tells Hibernate to format the SQL nicely in the IntelliJ console
spring.jpa.properties.hibernate.format_sql=true

# --- SQL Initialization (The Missing Pieces) ---
# 1. Tells Spring to always run data.sql on startup
spring.sql.init.mode=always

# 2. Ensures Hibernate creates the tables BEFORE the SQL script runs
spring.jpa.defer-datasource-initialization=true

# 3. Optional: If you face errors, this ensures the database is ready
# for the script even if the connection pool is slow.
spring.datasource.type=com.zaxxer.hikari.HikariDataSource

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3.2